# 网点损益分析规则
规则名称: 网点损益分析
适用板块: 网点经营
适用对象: 邮政营业网点
数据来源: 武邮网点损益台账（汇总报表）

# 红黑榜规则
红黑榜:
  红榜:
    定义: 单月营业利润排名 TOP N（盈利）
    判定公式: 按 营业利润_单月 降序取前 N
    默认数量: 10
  黑榜:
    定义: 单月营业利润排名后 N（亏损最多）
    判定公式: 按 营业利润_单月 升序取前 N
    默认数量: 10
  说明: 基于单月营业利润（累计差分），反映当月经营

# 亏损预警规则
亏损预警:
  判定基础: 单月营业利润（营业利润_单月）
  连续亏损:
    定义: 连续 N 个月单月营业利润 < 0
    预警等级:
      高危:
        条件: 连续 >= 3 个月亏损 且 累计亏损 > 10 万元
        图标: 🔴
      中危:
        条件: 连续 >= 3 个月亏损
        图标: 🟠
      低危:
        条件: 连续 2 个月亏损
        图标: 🟡
  示例:
    - 网点: 吴家山支局
      连续亏损月数: 5
      累计亏损: 202052 元
      判定: 高危

# 关键指标
关键指标:
  收入项:
    - 业务总收入
    - 代理金融收入
    - 寄递业务收入
    - 函件收入
    - 报刊收入
    - 集邮收入
  成本项:
    - 业务总成本
    - 主营业务成本
    - 管理费用
    - 人工成本
    - 租赁成本
    - 运输成本
  利润项:
    - 营业利润
    - 利润总额

# 业务应用
业务应用:
  - 网点经营分析
  - 亏损网点预警
  - 红黑榜激励管理
  - 资源配置优化
