<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="2064" height="2591" viewBox="0 0 2064 2591">
  <!-- 邮政信封主题 - 现代科技感 -->
  <defs>
    <linearGradient id="postalGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#16213e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f3460;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- 背景 -->
  <rect width="2064" height="2591" fill="url(#postalGradient)"/>
  
  <!-- 邮政网格图案 -->
  <g opacity="0.1" stroke="#ffffff" stroke-width="1" fill="none">
    <path d="M0 200 L2064 200 M0 400 L2064 400 M0 600 L2064 600 M0 800 L2064 800 M0 1000 L2064 1000 M0 1200 L2064 1200 M0 1400 L2064 1400 M0 1600 L2064 1600 M0 1800 L2064 1800 M0 2000 L2064 2000 M0 2200 L2064 2200 M0 2400 L2064 2400"/>
    <path d="M200 0 L200 2591 M400 0 L400 2591 M600 0 L600 2591 M800 0 L800 2591 M1000 0 L1000 2591 M1200 0 L1200 2591 M1400 0 L1400 2591 M1600 0 L1600 2591 M1800 0 L1800 2591 M2000 0 L2000 2591"/>
  </g>
  
  <!-- 中心信封图标 -->
  <g transform="translate(1032, 1295) scale(0.8)" filter="url(#glow)">
    <!-- 信封轮廓 -->
    <path d="M0 0 L800 400 L0 800 L-800 400 Z" fill="#ffffff" opacity="0.8"/>
    <!-- 信封内部线条 -->
    <path d="M0 50 L700 400 L0 750 L-700 400 Z" fill="none" stroke="#1a1a2e" stroke-width="3" opacity="0.5"/>
    <path d="M0 400 L0 750" stroke="#1a1a2e" stroke-width="3" opacity="0.5"/>
    <path d="M0 400 L0 50" stroke="#1a1a2e" stroke-width="3" opacity="0.5"/>
  </g>
  
  <!-- 数据流线条 -->
  <g opacity="0.3" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M200 200 Q500 400 800 200 T1400 200 T2000 200" filter="url(#glow)"/>
    <path d="M200 600 Q500 800 800 600 T1400 600 T2000 600" filter="url(#glow)"/>
    <path d="M200 1000 Q500 1200 800 1000 T1400 1000 T2000 1000" filter="url(#glow)"/>
    <path d="M200 1400 Q500 1600 800 1400 T1400 1400 T2000 1400" filter="url(#glow)"/>
    <path d="M200 1800 Q500 2000 800 1800 T1400 1800 T2000 1800" filter="url(#glow)"/>
    <path d="M200 2200 Q500 2400 800 2200 T1400 2200 T2000 2200" filter="url(#glow)"/>
  </g>
  
  <!-- 垂直数据流 -->
  <g opacity="0.2" stroke="#ffffff" stroke-width="2" fill="none">
    <path d="M300 0 Q350 600 300 1200 T300 2591" filter="url(#glow)"/>
    <path d="M700 0 Q750 600 700 1200 T700 2591" filter="url(#glow)"/>
    <path d="M1100 0 Q1150 600 1100 1200 T1100 2591" filter="url(#glow)"/>
    <path d="M1500 0 Q1550 600 1500 1200 T1500 2591" filter="url(#glow)"/>
    <path d="M1900 0 Q1950 600 1900 1200 T1900 2591" filter="url(#glow)"/>
  </g>
  
  <!-- 光点装饰 -->
  <g fill="#ffffff" filter="url(#glow)">
    <circle cx="300" cy="300" r="8" opacity="0.6"/>
    <circle cx="700" cy="500" r="6" opacity="0.5"/>
    <circle cx="1100" cy="350" r="7" opacity="0.55"/>
    <circle cx="1500" cy="450" r="6" opacity="0.5"/>
    <circle cx="1900" cy="380" r="7" opacity="0.55"/>
    
    <circle cx="400" cy="800" r="6" opacity="0.5"/>
    <circle cx="800" cy="900" r="7" opacity="0.55"/>
    <circle cx="1200" cy="850" r="6" opacity="0.5"/>
    <circle cx="1600" cy="920" r="8" opacity="0.6"/>
    
    <circle cx="350" cy="1300" r="7" opacity="0.55"/>
    <circle cx="750" cy="1400" r="6" opacity="0.5"/>
    <circle cx="1150" cy="1350" r="8" opacity="0.6"/>
    <circle cx="1550" cy="1420" r="6" opacity="0.5"/>
    <circle cx="1950" cy="1380" r="7" opacity="0.55"/>
    
    <circle cx="450" cy="1800" r="6" opacity="0.5"/>
    <circle cx="850" cy="1900" r="7" opacity="0.55"/>
    <circle cx="1250" cy="1850" r="6" opacity="0.5"/>
    <circle cx="1650" cy="1920" r="8" opacity="0.6"/>
    
    <circle cx="380" cy="2300" r="7" opacity="0.55"/>
    <circle cx="780" cy="2400" r="6" opacity="0.5"/>
    <circle cx="1180" cy="2350" r="7" opacity="0.55"/>
    <circle cx="1580" cy="2420" r="6" opacity="0.5"/>
    <circle cx="1980" cy="2380" r="8" opacity="0.6"/>
  </g>
  
  <!-- 邮政标识元素 -->
  <g transform="translate(1032, 1800)" opacity="0.4">
    <path d="M0 0 L100 -50 L200 0 L100 50 Z" fill="#ffffff" filter="url(#glow)"/>
    <text x="0" y="120" font-family="Arial, sans-serif" font-size="40" fill="#ffffff" text-anchor="middle" filter="url(#glow)">邮览官</text>
  </g>
</svg>
